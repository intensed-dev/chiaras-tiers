<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta property="og:title" content="Chiara's Tiers">
  <meta property="og:description" content="The official Ranklist for Chiara's games on sujuxi smp.">
  <meta property="og:image" content="chiaras-tiers.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://intensed-dev.github.io/chiaras-tiers">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The official Ranklist for Chiara's games on sujuxi smp.">
  <link rel="icon" href="chiaras-tiers.png">
  <title>Chiara's Tiers</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090c;
      --panel: #101218;
      --panel-2: #151821;
      --border: #242833;
      --text: #f4f5f7;
      --muted: #8f96a5;
      --accent: #a78bfa;
      --accent-soft: rgba(167,139,250,.12);
      --gold: #f5c451;
      --verified: #51f57d;
      --moderator: #f55151;
      --bot: #51c7f5;
      --silver: #b9c1cc;
      --bronze: #d99462;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(167,139,250,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    header { margin-bottom: 32px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 6vw, 58px);
      letter-spacing: -.045em;
      line-height: 1;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 16px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: rgba(16,18,24,.8);
      border-radius: 16px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      border: 0;
      color: var(--muted);
      background: transparent;
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font: inherit;
      font-weight: 650;
      transition: .16s ease;
    }

    .tab:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .tab.active {
      color: var(--text);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(167,139,250,.16);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin: 24px 2px 12px;
    }

    .meta h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .meta p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .board {
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(16,18,24,.92);
      border-radius: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      transition: background .15s ease;
    }

    .row:last-child { border-bottom: 0; }
    .row:hover { background: rgba(255,255,255,.025); }

    .rank {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
    }

    .rank.top {
      border-radius: 10px;
      background: var(--panel-2);
    }

    .rank.gold { color: var(--gold); }
    .rank.silver { color: var(--silver); }
    .rank.bronze { color: var(--bronze); }

    .badge { font-size: 14px; vertical-align: middle; size: 14px; width: 14px; height: 14px; }
    .badge.admin { color: var(--gold); }
    .badge.verified { color: var(--verified); }
    .badge.moderator { color: var(--moderator); }
    .badge.bot { color: var(--bot); }

    .user {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #191c25;
      border: 1px solid var(--border);
      image-rendering: pixelated;
      flex: 0 0 auto;
    }

    .username {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .points { text-align: right; }

    .points strong {
      display: block;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .points span {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 48px 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      .shell {
        width: min(100% - 20px, 1080px);
        padding-top: 32px;
      }

      .row {
        grid-template-columns: 42px 1fr auto;
        padding: 13px 12px;
        gap: 8px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .points strong { font-size: 15px; }

      .meta {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">
        <i data-lucide="bar-chart-3" size="15"></i>
        Chiara's Tiers
      </div>
      <h1>Rankings</h1>
      <p class="subtitle">See who has earned the most points.</p>
    </header>

    <nav id="tabs" class="tabs" aria-label="Leaderboards"></nav>

    <section class="meta">
      <div>
        <h2 id="board-title">Overall</h2>
        <p id="board-description"></p>
      </div>
      <div class="count" id="user-count"></div>
    </section>

    <section class="board" id="board" aria-live="polite"></section>
  </main>

  <script>
    let data;
    let activeBoard = "overall";

    const number = new Intl.NumberFormat("en-US");

    async function loadData() {
      const response = await fetch("./data.json");

      if (!response.ok) {
        throw new Error("Could not load data.json.");
      }

      data = await response.json();

      renderTabs();
      renderBoard(activeBoard);
      lucide.createIcons();
    }

    function getPoints(user, leaderboardId) {
      if (leaderboardId === "overall") {
        return Object.values(user.categories || {})
          .reduce((sum, points) => sum + Number(points || 0), 0);
      }

      return Number(user.categories?.[leaderboardId] || 0);
    }

    function renderTabs() {
      const tabs = document.querySelector("#tabs");

      tabs.innerHTML = data.leaderboards.map(board => `
        <button class="tab ${board.id === activeBoard ? "active" : ""}" data-id="${escapeHtml(board.id)}">
          <i data-lucide="${escapeHtml(board.icon)}" size="17"></i>
          <span>${escapeHtml(board.name)}</span>
        </button>
      `).join("");

      tabs.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          activeBoard = tab.dataset.id;
          renderTabs();
          renderBoard(activeBoard);
          lucide.createIcons();
        });
      });
    }

    function renderBoard(id) {
      const config = data.leaderboards.find(board => board.id === id);
      const board = document.querySelector("#board");

      document.querySelector("#board-title").textContent = config?.name ?? "Leaderboard";
      document.querySelector("#board-description").textContent = config?.description ?? "";
      document.querySelector("#user-count").textContent =
        `${data.users.length} ${data.users.length === 1 ? "user" : "users"}`;

      const users = [...data.users].sort(
        (a, b) => getPoints(b, id) - getPoints(a, id)
      );

      if (!users.length) {
        board.innerHTML = `<div class="empty">No users yet.</div>`;
        return;
      }

      board.innerHTML = users.map((user, index) => {
        const rank = index + 1;
        const points = getPoints(user, id);
        const medalClass =
          rank === 1 ? "gold" :
          rank === 2 ? "silver" :
          rank === 3 ? "bronze" : "";

        const userImageUrl =
          user.username === "Test Account" ? "test-big.png" :
          user.username === "Unknown" ? "unknown-big.png" : `https://render.crafty.gg/2d/head/${encodeURIComponent(user.username)}?size=256`;
        
        const userBadges =
          user.admin == true ? `<i data-lucide="crown" class="badge admin" size="12"></i> <i data-lucide="badge-check" class="badge verified" size="12"></i>` :
          user.moderator == true ? `<i data-lucide="gavel" class="badge moderator" size="12"></i> <i data-lucide="badge-check" class="badge verified" size="12"></i>` :
          user.bot == true ? `<i data-lucide="bot" class="badge bot" size="12"></i> <i data-lucide="badge-check" class="badge verified" size="12"></i>` :
          user.verified == true ? `<i data-lucide="badge-check" class="badge verified" size="12"></i>` : ``;

        return `
          <article class="row">
            <div class="rank ${rank <= 3 ? "top" : ""} ${medalClass}">
              ${rank}
            </div>

            <div class="user">
              <img
                class="avatar"
                src="${userImageUrl}"
                alt=""
                loading="lazy"
                onerror="this.style.visibility='hidden'"
              />

              <div>
                <div class="username">${escapeHtml(user.nickname)} ${userBadges}</div>
                <div class="label">#${rank} • ${escapeHtml(user.username)}</div>
              </div>
            </div>

            <div class="points">
              <strong>${number.format(points)}</strong>
              <span>points</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadData().catch(error => {
      document.querySelector("#board").innerHTML =
        `<div class="empty">${escapeHtml(error.message)}</div>`;
    });
  </script>
</body>
</html>
